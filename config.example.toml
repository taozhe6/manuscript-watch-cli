# manuscript-watch-cli configuration (keep mode 0600).
# Tip: use `password_env` or `password_cmd` when reading secrets from env or external managers.

[[accounts]]
id = "gastro-main"
provider = "editorial_manager"
journal = "gastro"
name = "Gastroenterology"
username = "your_username"
password = "your_password"
enabled = false

[[accounts]]
id = "iovs-main"
provider = "ejournalpress"
journal = "iovs"
name = "IOVS"
username = "your_ejp_username"
password_env = "EJOURNALPRESS_PASSWORD"
enabled = false
